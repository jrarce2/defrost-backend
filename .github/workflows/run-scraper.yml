name: Run Defrost Scraper

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: node index.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pins.json
          git diff --staged --quiet || git commit -m "Update pins.json"
          git push